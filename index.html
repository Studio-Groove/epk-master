<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPK Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0b10;color:#e8e8ef}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#14141c;border-bottom:1px solid #26263a;position:sticky;top:0;z-index:10}
.top b{font-weight:800;letter-spacing:.5px;margin-right:auto}.top input{width:210px}
.app{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 54px)}
#ed{padding:16px;border-right:1px solid #26263a;overflow:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#9a9ab5;margin:22px 0 8px}
label{display:block;font-size:12px;color:#b5b5cc;margin:10px 0 4px}
input,textarea,select{width:100%;background:#0f0f16;border:1px solid #2c2c44;color:#fff;border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
textarea{min-height:76px;resize:vertical}input[type=color]{padding:2px;height:38px}
button{background:#7c5cff;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 13px Inter;cursor:pointer}button.g{background:#26263a}
#thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
#thumbs div{position:relative;aspect-ratio:1;background-size:cover;background-position:center;border-radius:6px}
#thumbs span{position:absolute;top:2px;right:2px;background:#000a;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:13px}
.lead{background:#14141c;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}.lead b{color:#a995ff}
small{color:#7d7d98;font-size:11px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}#toast.on{opacity:1}
@media(max-width:900px){.app{grid-template-columns:1fr}#ed{position:static;max-height:none;border:0}}
@media print{.top,#ed,#toast{display:none!important}.app{display:block}body{background:#fff}}
</style>
</head>
<body>
<div class="top">
  <b>EPK&nbsp;MASTER</b>
  <span id="who"><input id="em" type="email" placeholder="seu e-mail para entrar"> <button class="g" id="login">Entrar</button></span>
  <button id="save">Salvar</button>
  <button class="g" id="pub">Link público</button>
  <button class="g" id="exp">Baixar HTML</button>
  <button class="g" id="prt">PDF</button>
</div>
<div class="app"><div id="ed"></div><div id="pv"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/kit.js"></script>
<script>
const SUPABASE_URL = "https://kwxutgeqexqqrwhgvebh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3eHV0Z2VxZXhxcXJ3aGd2ZWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODYyMTQsImV4cCI6MjExMDE2MjIxNH0.a7zCa4MKeS4lXpjdbte2PbfwN1Yl5v4T8Qql9u5Oq7o";
const RESERVED = ['api', 'kit', 'index', 'app', 'admin'];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2800); };
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null;

const DEF = { name: '', genre: '', city: '', tagline: '', accent: '#7c5cff', theme: 'dark', lang: 'en', cover: '', photos: [], bio_en: '', bio_pt: '', tracks: '', agenda: '', rel: '', play: '', sup: '', quotes: '', files: '', email: '', phone: '', socials: '', slug: '' };
let kit = { ...DEF, ...JSON.parse(localStorage.getItem('epk2') || '{}') };

const FIELDS = [
 ['Identidade'], ['Nome artístico', 'name'], ['Gênero', 'genre'], ['Cidade / País', 'city'], ['Frase de impacto', 'tagline'],
 ['Cor de destaque', 'accent', 'color'], ['Tema', 'theme', 'select', [['dark', 'Escuro'], ['light', 'Claro']]],
 ['Idioma principal do kit', 'lang', 'select', [['en', 'English'], ['pt', 'Português']]],
 ['Imagens'], ['__files', '__files'],
 ['Biografia'], ['Bio em inglês (linha em branco separa parágrafos)', 'bio_en', 'area'], ['Bio em português', 'bio_pt', 'area'],
 ['Música e agenda'], ['Faixas e vídeos (Título | link Spotify/YouTube/SoundCloud)', 'tracks', 'area'], ['Próximas datas (AAAA-MM-DD | Evento | Cidade)', 'agenda', 'area'],
 ['Destaques'], ['Lançou em (selos, um por linha ou separados por vírgula)', 'rel', 'area'], ['Tocou em', 'play', 'area'], ['Apoiado por', 'sup', 'area'],
 ['Citações de imprensa (Citação | Fonte)', 'quotes', 'area'],
 ['Contato'], ['E-mail de booking', 'email', 'email'], ['WhatsApp (com DDI, ex.: 5511999999999)', 'phone'], ['Redes (Nome | link)', 'socials', 'area'],
 ['Downloads (Nome | link do Drive)', 'files', 'area'],
 ['Link público'], ['Slug (epk-master.vercel.app/slug)', 'slug']
];
$('#ed').innerHTML = FIELDS.map(([l, k, t, o]) => {
  if (!k) return `<h3>${l}</h3>`;
  if (k === '__files') return `<label>Foto de capa (alta resolução)</label><input type="file" id="cov" accept="image/*"><label>Fotos de imprensa (várias)</label><input type="file" id="pho" accept="image/*" multiple><div id="thumbs"></div><small>Entre com seu e-mail antes de enviar fotos, para que fiquem na nuvem.</small>`;
  const c = t === 'area' ? `<textarea data-k="${k}"></textarea>` : t === 'select' ? `<select data-k="${k}">${o.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select>` : `<input data-k="${k}" type="${t || 'text'}">`;
  return `<label>${l}</label>${c}`;
}).join('') + `<h3>Pedidos recebidos</h3><div id="leads"><small>Entre para ver pedidos de booking e a lista VIP.</small></div>`;

const draw = () => { $('#pv').innerHTML = EPK.renderKit(kit); };
const local = () => localStorage.setItem('epk2', JSON.stringify(kit));
function thumbs() { $('#thumbs').innerHTML = (kit.photos || []).map((p, i) => `<div style="background-image:url('${esc(p)}')"><span data-i="${i}">×</span></div>`).join(''); }
function fill() { $$('[data-k]').forEach(e => e.value = kit[e.dataset.k] ?? ''); thumbs(); draw(); }

const shrink = (f, max = 1600) => new Promise(r => { const i = new Image(); i.onload = () => { const s = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * s; c.height = i.height * s; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); c.toBlob(r, 'image/jpeg', .85); URL.revokeObjectURL(i.src); }; i.src = URL.createObjectURL(f); });
async function store(f) {
  const b = await shrink(f);
  if (user) {
    const p = `${user.id}/${Date.now()}${Math.random().toString(36).slice(2, 6)}.jpg`;
    const { error } = await sb.storage.from('epk-media').upload(p, b, { contentType: 'image/jpeg' });
    if (error) { toast('Upload: ' + error.message); return null; }
    return sb.storage.from('epk-media').getPublicUrl(p).data.publicUrl;
  }
  return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
}
$('#cov').onchange = async e => { if (!e.target.files[0]) return; toast('Enviando…'); const u = await store(e.target.files[0]); if (u) { kit.cover = u; draw(); local(); toast('Capa pronta'); } };
$('#pho').onchange = async e => { toast('Enviando…'); for (const f of e.target.files) { const u = await store(f); if (u) kit.photos.push(u); } thumbs(); draw(); local(); toast('Fotos prontas'); };
$('#thumbs').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { kit.photos.splice(+i, 1); thumbs(); draw(); local(); } };
$$('[data-k]').forEach(e => e.oninput = () => { kit[e.dataset.k] = e.value; draw(); local(); });

async function save() {
  local();
  if (!user) { toast('Salvo só neste navegador. Entre com e-mail para salvar na nuvem.'); return false; }
  kit.slug = EPK.slugify(kit.slug || kit.name) || ('kit-' + user.id.slice(0, 6));
  if (RESERVED.includes(kit.slug)) { toast('Esse slug é reservado, escolha outro'); return false; }
  $('[data-k=slug]').value = kit.slug;
  const { error } = await sb.from('epks').upsert({ user_id: user.id, slug: kit.slug, data: kit, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
  if (error) { toast(error.code === '23505' ? 'Esse slug já existe, escolha outro' : error.message); return false; }
  toast('Salvo na nuvem ✓'); return true;
}
$('#save').onclick = save;
$('#pub').onclick = async () => {
  if (!(await save())) return;
  const l = location.origin + '/' + kit.slug;
  try { await navigator.clipboard.writeText(l); } catch (_) {}
  prompt('Link público (copiado):', l);
};
$('#prt').onclick = () => print();
$('#exp').onclick = () => {
  const h = EPK.renderPage(kit, { slug: kit.slug, supabaseUrl: SUPABASE_URL, supabaseKey: SUPABASE_KEY });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([h], { type: 'text/html' }));
  a.download = (EPK.slugify(kit.name) || 'press-kit') + '.html'; a.click();
};

$('#login').onclick = async () => {
  const email = $('#em').value.trim(); if (!email) return toast('Digite seu e-mail');
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin } });
  toast(error ? error.message : 'Link enviado! Confira seu e-mail');
};
async function loadLeads() {
  const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(50);
  if (error) return;
  $('#leads').innerHTML = data.length ? data.map(l => `<div class="lead"><b>${l.kind === 'booking' ? 'BOOKING' : 'VIP'}</b> · ${esc(l.name)} · <a style="color:#a995ff" href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.whatsapp ? ' · ' + esc(l.whatsapp) : ''}${l.event_date ? '<br>📅 ' + esc(l.event_date) : ''}${l.city ? ' · ' + esc(l.city) : ''}${l.message ? '<br>' + esc(l.message) : ''}<br><small>${new Date(l.created_at).toLocaleString('pt-BR')}</small></div>`).join('') : '<small>Nenhum pedido ainda.</small>';
}
async function onUser(u) {
  user = u;
  if (!u) return;
  $('#who').innerHTML = `<small>${esc(u.email)}</small> <button class="g" id="out">Sair</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const { data } = await sb.from('epks').select('data').eq('user_id', u.id).maybeSingle();
  if (data?.data) { kit = { ...DEF, ...data.data }; fill(); local(); }
  loadLeads();
}

fill();
sb.auth.getSession().then(({ data }) => onUser(data.session?.user || null));
sb.auth.onAuthStateChange((_, s) => { if ((s?.user?.id || null) !== (user?.id || null)) onUser(s?.user || null); });
</script>
</body>
</html>
